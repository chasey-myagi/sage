name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      # Builds dist/, runs the tests, then packs the CLI, installs the tarball
      # into an empty directory, and runs `sage --help` (check:smoke).
      - run: pnpm check
