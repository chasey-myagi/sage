"176.0" width="440.0" height="96.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig3-shadow)"/><text x="636.0" y="208.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">主会话视图</text><text x="636.0" y="228.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.58 0.14 250)"><tspan x="636.0" dy="0.0">最近几轮全文，更早的按档位留桩</tspan></text><text x="636.0" y="245.5" font-size="11" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="636.0" dy="0.0">本轮用掉 4.2万，预算 12万 token</tspan></text></g><g id="fig3-n-v2"><rect x="620.0" y="296.0" width="440.0" height="96.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig3-shadow)"/><text x="636.0" y="328.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">子 agent 视图</text><text x="636.0" y="348.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.58 0.14 250)"><tspan x="636.0" dy="0.0">换个问题和预算，在同一份日志上再编译一次</tspan></text><text x="636.0" y="365.5" font-size="11" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="636.0" dy="0.0">只带与子任务相关的块，预算 3万 token</tspan></text></g><g id="fig3-n-v3"><rect x="620.0" y="416.0" width="440.0" height="96.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig3-shadow)"/><text x="636.0" y="448.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">后台只读视图</text><text x="636.0" y="468.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.58 0.14 250)"><tspan x="636.0" dy="0.0">审查、eval、跨模型复看，共享同一份检索结果</tspan></text><text x="636.0" y="485.5" font-size="11" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="636.0" dy="0.0">只读工具子集并行跑，预算 2万 token</tspan></text></g><text x="1144.0" y="56.0" text-anchor="end" font-size="44" font-weight="780" fill="oklch(0.28 0.02 300)">一份 Log，三份视图</text><text x="1144.0" y="84.0" font-size="13" font-weight="400" text-anchor="end" fill="oklch(0.48 0.02 300)"><tspan x="1144.0" dy="0.0">子任务和后台任务都不复制历史，只是换个问题和预算，在</tspan><tspan x="1144.0" dy="18.0">同一份日志上再编译一次。</tspan></text><text x="1144.0" y="140.0" text-anchor="end" font-size="11" font-weight="650" letter-spacing="0.08em" fill="oklch(0.68 0.14 75)">预算为示意</text><rect x="28.0" y="560.0" width="64.4" height="22" rx="11" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)"/><text x="60.2" y="575.5" text-anchor="middle" font-size="11" fill="oklch(0.48 0.02 300)">一份 Log</text><rect x="100.4" y="560.0" width="64.0" height="22" rx="11" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)"/><text x="132.4" y="575.5" text-anchor="middle" font-size="11" fill="oklch(0.48 0.02 300)">三份视图</text><rect x="172.4" y="560.0" width="54.0" height="22" rx="11" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)"/><text x="199.4" y="575.5" text-anchor="middle" font-size="11" fill="oklch(0.48 0.02 300)">零拷贝</text><text x="1152.0" y="576.0" text-anchor="end" font-size="12.5" font-weight="650" fill="oklch(0.68 0.14 75)">0  复制的历史</text></g></svg>