th="1.2" filter="url(#fig1-shadow)"/><text x="244.0" y="256.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">_messages[]</text><text x="244.0" y="276.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="244.0" dy="0.0">内核持有的那个数组</tspan></text></g><g id="fig1-n-a_micro"><rect x="428.0" y="224.0" width="166.0" height="84.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig1-shadow)"/><text x="444.0" y="256.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">microcompact</text><text x="444.0" y="276.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="444.0" dy="0.0">旧工具输出换占位符</tspan></text></g><g id="fig1-n-a_auto"><rect x="606.0" y="224.0" width="166.0" height="84.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig1-shadow)"/><text x="622.0" y="256.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">autoCompaction</text><text x="622.0" y="276.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="622.0" dy="0.0">超阈值就总结成一条</tspan></text></g><g id="fig1-n-a_trim"><rect x="784.0" y="224.0" width="150.0" height="84.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig1-shadow)"/><text x="800.0" y="256.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">trimHistory</text><text x="800.0" y="276.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="800.0" dy="0.0">按条数换占位符</tspan></text></g><g id="fig1-n-a_llm"><rect x="976.0" y="224.0" width="152.0" height="84.0" rx="14" fill="oklch(0.95 0.055 85)" stroke="oklch(0.78 0.10 75)" stroke-width="1.2" filter="url(#fig1-shadow)"/><text x="992.0" y="256.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">发给 LLM</text><text x="992.0" y="276.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="992.0" dy="0.0">每一轮重算一遍</tspan></text></g><g id="fig1-n-note1"><rect x="34.0" y="364.0" width="1112.0" height="66.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="52.0" y="392.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">数组既是记录，也是视图</text><text x="52.0" y="412.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="52.0" dy="0.0">谁先谁后只写在源码注释里，装配器不检查；总结一次，前缀就全变、缓存全丢；总结还有损，原文再也要不回来。</tspan></text></g><g id="fig1-n-b_log"><rect x="48.0" y="516.0" width="124.0" height="84.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig1-shadow)"/><g transform="translate(64.0 535.0)"><rect width="18" height="18" rx="5" fill="oklch(0.96 0.01 90)"/><path d="M4 8 l6-3 6 3 -6 3 z M4 12 l6 3 6-3 M4 16 l6 3 6-3" fill="none" stroke="oklch(0.28 0.02 300)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90.0" y="548.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">Log</text><text x="64.0" y="568.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="64.0" dy="0.0">只追加，原文留着</tspan></text></g><g id="fig1-n-b_seam"><rect x="200.0" y="516.0" width="124.0" height="84.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig1-shadow)"/><text x="216.0" y="548.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">View seam</text><text x="216.0" y="568.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="216.0" dy="0.0">每轮调一次</tspan></text></g><g id="fig1-n-c1"><rect x="366.0" y="516.0" width="110.0" height="84.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig1-shadow)"/><text x="382.0" y="548.0" font-size="15" font-weight="650"