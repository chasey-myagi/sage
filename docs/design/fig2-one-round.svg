<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-label="一轮编译的六个步骤：收 claims、确定性淘汰、打分、阶段判定、组装、发出并留痕；每一步下面挂着这一轮的具体情形" font-family="-apple-system,'PingFang SC','Noto Sans CJK SC','Segoe UI',sans-serif"><defs><filter id="fig2-shadow" x="-8%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="oklch(0.35 0.02 300 / 0.10)"/></filter><marker id="fig2-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.2 L9,5 L0,8.8 Z" fill="oklch(0.78 0.012 300)"/></marker><marker id="fig2-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.2 L9,5 L0,8.8 Z" fill="oklch(0.62 0.015 300)"/></marker><marker id="fig2-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.2 L9,5 L0,8.8 Z" fill="oklch(0.68 0.14 75)"/></marker><marker id="fig2-arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.2 L9,5 L0,8.8 Z" fill="oklch(0.58 0.19 25)"/></marker><marker id="fig2-arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1.2 L9,5 L0,8.8 Z" fill="oklch(0.58 0.14 250)"/></marker><style>#fig2-root { background: oklch(0.985 0.004 300); }@media (prefers-reduced-motion: reduce) { .lp-bead { display: none; } }</style></defs><g id="fig2-root"><rect width="100%" height="100%" fill="oklch(0.985 0.004 300)"/><path id="fig2-e0" d="M 200.0 226.0 L 228.0 226.0" fill="none" stroke="oklch(0.58 0.14 250)" stroke-width="1.35" marker-end="url(#fig2-arrow-blue)"/><path id="fig2-e1" d="M 386.0 226.0 L 414.0 226.0" fill="none" stroke="oklch(0.58 0.14 250)" stroke-width="1.35" marker-end="url(#fig2-arrow-blue)"/><path id="fig2-e2" d="M 572.0 226.0 L 619.0 226.0" fill="none" stroke="oklch(0.58 0.14 250)" stroke-width="1.35" marker-end="url(#fig2-arrow-blue)"/><path id="fig2-e3" d="M 739.0 226.0 L 786.0 226.0" fill="none" stroke="oklch(0.58 0.19 25)" stroke-width="1.35" marker-end="url(#fig2-arrow-red)"/><path id="fig2-e4" d="M 944.0 226.0 L 972.0 226.0" fill="none" stroke="oklch(0.68 0.14 75)" stroke-width="1.35" marker-end="url(#fig2-arrow-amber)"/><path id="fig2-e5" d="M 121.0 272.0 L 121.0 316.0" fill="none" stroke="oklch(0.62 0.015 300)" stroke-width="1.35" stroke-dasharray="6 6"/><path id="fig2-e6" d="M 307.0 272.0 L 307.0 316.0" fill="none" stroke="oklch(0.62 0.015 300)" stroke-width="1.35" stroke-dasharray="6 6"/><path id="fig2-e7" d="M 493.0 272.0 L 493.0 316.0" fill="none" stroke="oklch(0.62 0.015 300)" stroke-width="1.35" stroke-dasharray="6 6"/><path id="fig2-e8" d="M 679.0 285.0 L 679.0 316.0" fill="none" stroke="oklch(0.62 0.015 300)" stroke-width="1.35" stroke-dasharray="6 6"/><path id="fig2-e9" d="M 865.0 272.0 L 865.0 316.0" fill="none" stroke="oklch(0.62 0.015 300)" stroke-width="1.35" stroke-dasharray="6 6"/><path id="fig2-e10" d="M 1051.0 272.0 L 1051.0 316.0" fill="none" stroke="oklch(0.62 0.015 300)" stroke-width="1.35" stroke-dasharray="6 6"/><g id="fig2-n-s1"><rect x="42.0" y="180.0" width="158.0" height="92.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig2-shadow)"/><text x="58.0" y="212.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">收 claims</text><text x="58.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="58.0" dy="0.0">谁要多少预算</tspan></text></g><g id="fig2-n-s2"><rect x="228.0" y="180.0" width="158.0" height="92.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig2-shadow)"/><text x="244.0" y="212.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">确定性淘汰</text><text x="244.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="244.0" dy="0.0">被覆盖的直接作废</tspan></text></g><g id="fig2-n-s3"><rect x="414.0" y="180.0" width="158.0" height="92.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig2-shadow)"/><text x="430.0" y="212.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">打分</text><text x="430.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="430.0" dy="0.0">剩下的定档位</tspan></text></g><g id="fig2-n-s4"><polygon points="679.0,167.0 739.0,226.0 679.0,285.0 619.0,226.0" fill="oklch(0.95 0.035 25)" stroke="oklch(0.58 0.19 25)" stroke-width="1.5"/><text x="679.0" y="218.0" text-anchor="middle" font-size="13" font-weight="650" fill="oklch(0.28 0.02 300)">阶段判定</text><text x="679.0" y="240.0" font-size="11" font-weight="400" text-anchor="middle" fill="oklch(0.48 0.02 300)"><tspan x="679.0" dy="0.0">沿用冻结前缀</tspan></text></g><g id="fig2-n-s5"><rect x="786.0" y="180.0" width="158.0" height="92.0" rx="14" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1.2" filter="url(#fig2-shadow)"/><text x="802.0" y="212.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">组装</text><text x="802.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="802.0" dy="0.0">前缀原样，尾部追加</tspan></text></g><g id="fig2-n-s6"><rect x="972.0" y="180.0" width="158.0" height="92.0" rx="14" fill="oklch(0.95 0.055 85)" stroke="oklch(0.78 0.10 75)" stroke-width="1.2" filter="url(#fig2-shadow)"/><text x="988.0" y="212.0" font-size="15" font-weight="650" fill="oklch(0.28 0.02 300)">发出并留痕</text><text x="988.0" y="232.0" font-size="11.5" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="988.0" dy="0.0">清单进 session-log</tspan></text></g><g id="fig2-n-k1"><rect x="42.0" y="316.0" width="158.0" height="150.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="60.0" y="344.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">① 五张单子</text><text x="60.0" y="364.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="60.0" dy="0.0">提醒占1行、工具目录</tspan><tspan x="60.0" dy="16.5">占100行、账本占1段</tspan><tspan x="60.0" dy="16.5">并钉住，再加历史里</tspan><tspan x="60.0" dy="16.5">212块各报大小，还有</tspan><tspan x="60.0" dy="16.5">一段 AGENTS.md</tspan></text></g><g id="fig2-n-k2"><rect x="228.0" y="316.0" width="158.0" height="150.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="246.0" y="344.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">② 作废两处</text><text x="246.0" y="364.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="246.0" dy="0.0">第12轮读过的文件第</tspan><tspan x="246.0" dy="16.5">31轮又读一次，前一</tspan><tspan x="246.0" dy="16.5">份当场作废；失败重试</tspan><tspan x="246.0" dy="16.5">的中间输出同样作废。</tspan></text></g><g id="fig2-n-k3"><rect x="414.0" y="316.0" width="158.0" height="150.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="432.0" y="344.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">③ 按相关度定档</text><text x="432.0" y="364.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="432.0" dy="0.0">剩下180块按「跟这轮</tspan><tspan x="432.0" dy="16.5">的问题有多相关」定档</tspan><tspan x="432.0" dy="16.5">位。默认用一套规则，</tspan><tspan x="432.0" dy="16.5">也可换便宜模型来打。</tspan></text></g><g id="fig2-n-k4"><rect x="600.0" y="316.0" width="158.0" height="150.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="618.0" y="344.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">④ 这一轮不重开</text><text x="618.0" y="364.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="618.0" dy="0.0">算一笔账：这轮能甩掉</tspan><tspan x="618.0" dy="16.5">的还抵不上重建一次前</tspan><tspan x="618.0" dy="16.5">缀，于是沿用第3阶段</tspan><tspan x="618.0" dy="16.5">那份冻结前缀。</tspan></text></g><g id="fig2-n-k5"><rect x="786.0" y="316.0" width="158.0" height="150.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="804.0" y="344.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">⑤ 省掉的留一行桩</text><text x="804.0" y="364.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="804.0" dy="0.0">前缀一个字节不动，新</tspan><tspan x="804.0" dy="16.5">内容接在尾部；省掉的</tspan><tspan x="804.0" dy="16.5">块原地留一行，写明多</tspan><tspan x="804.0" dy="16.5">大、怎么取回。</tspan></text></g><g id="fig2-n-k6"><rect x="972.0" y="316.0" width="158.0" height="150.0" rx="16" fill="oklch(0.975 0.006 300)" stroke="oklch(0.91 0.012 300)" stroke-width="1"/><text x="990.0" y="344.0" font-size="14" font-weight="650" fill="oklch(0.28 0.02 300)">⑥ 这一轮发了多少</text><text x="990.0" y="364.0" font-size="12" font-weight="400" text-anchor="start" fill="oklch(0.48 0.02 300)"><tspan x="990.0" dy="0.0">清单同时落盘：每块的</tspan><tspan x="990.0" dy="16.5">档位和理由都在，回头</tspan><tspan x="990.0" dy="16.5">能重放。本轮视图共</tspan><tspan x="990.0" dy="16.5">4.2万 token</tspan></text></g><text x="1144.0" y="56.0" text-anchor="end" font-size="44" font-weight="780" fill="oklch(0.28 0.02 300)">第 37 轮的这一次编译</text><text x="1144.0" y="84.0" font-size="13" font-weight="400" text-anchor="end" fill="oklch(0.48 0.02 300)"><tspan x="1144.0" dy="0.0">编译器在每次调用模型之前从头走这六步。下面一排小卡，</tspan><tspan x="1144.0" dy="18.0">是这一轮它真正看到的东西。</tspan></text><text x="1144.0" y="140.0" text-anchor="end" font-size="11" font-weight="650" letter-spacing="0.08em" fill="oklch(0.68 0.14 75)">数字为示意，用来说清楚步骤</text><rect x="28.0" y="520.0" width="149.1" height="22" rx="11" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)"/><text x="102.6" y="535.5" text-anchor="middle" font-size="11" fill="oklch(0.48 0.02 300)">一次 LLM 调用 = 一次编译</text><rect x="185.1" y="520.0" width="97.0" height="22" rx="11" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)"/><text x="233.6" y="535.5" text-anchor="middle" font-size="11" fill="oklch(0.48 0.02 300)">每块都要有理由</text><rect x="290.1" y="520.0" width="64.0" height="22" rx="11" fill="oklch(1 0.002 300)" stroke="oklch(0.91 0.012 300)"/><text x="322.1" y="535.5" text-anchor="middle" font-size="11" fill="oklch(0.48 0.02 300)">清单落盘</text><text x="1152.0" y="536.0" text-anchor="end" font-size="12.5" font-weight="650" fill="oklch(0.68 0.14 75)">4.2 万  本轮 token</text><text x="1020.0" y="536.0" text-anchor="end" font-size="12.5" font-weight="650" fill="oklch(0.28 0.02 300)">212  历史块</text></g></svg>